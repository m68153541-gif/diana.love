<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Настя, я тебе нравлюсь?</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    overflow: hidden;
    background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #a18cd1 100%);
    background-size: 200% 200%;
    animation: bgShift 8s ease infinite;
  }
  @keyframes bgShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .hearts-bg {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
  }
  .hearts-bg span {
    position: absolute;
    bottom: -60px;
    font-size: 24px;
    opacity: .7;
    animation: floatUp linear infinite;
  }
  @keyframes floatUp {
    0%   { transform: translateY(0) rotate(0deg); opacity: 0; }
    10%  { opacity: .8; }
    100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
  }

  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 400px;
    padding: 40px 28px 32px;
    border-radius: 28px;
    text-align: center;
    background: rgba(255, 255, 255, .22);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255, 255, 255, .4);
    box-shadow: 0 20px 60px rgba(161, 140, 209, .35);
    animation: cardIn .7s cubic-bezier(.2, .8, .3, 1.2);
  }
  @keyframes cardIn {
    from { transform: scale(.85) translateY(30px); opacity: 0; }
    to   { transform: scale(1) translateY(0); opacity: 1; }
  }

  .big-heart {
    font-size: 64px;
    line-height: 1;
    display: inline-block;
    animation: beat 1.1s ease-in-out infinite;
    filter: drop-shadow(0 6px 14px rgba(255, 80, 120, .5));
  }
  @keyframes beat {
    0%, 100% { transform: scale(1); }
    25%      { transform: scale(1.18); }
    50%      { transform: scale(.95); }
    75%      { transform: scale(1.12); }
  }

  h1 {
    margin-top: 18px;
    font-size: 26px;
    font-weight: 800;
    line-height: 1.3;
    color: #fff;
    text-shadow: 0 2px 12px rgba(190, 70, 120, .55);
  }
  h1 .name {
    background: linear-gradient(90deg, #ff4d8d, #ff8fab, #ff4d8d);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shine 3s linear infinite;
    font-size: 30px;
  }
  @keyframes shine { to { background-position: 200% center; } }

  .subtitle {
    margin-top: 10px;
    font-size: 15px;
    color: rgba(255, 255, 255, .9);
    font-weight: 500;
    text-shadow: 0 1px 6px rgba(150, 60, 110, .4);
  }

  .buttons {
    margin-top: 30px;
    display: flex;
    gap: 14px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .btn {
    flex: 1;
    min-width: 100px;
    max-width: 150px;
    padding: 16px 10px;
    border: none;
    border-radius: 16px;
    font-size: 18px;
    font-weight: 800;
    cursor: pointer;
    letter-spacing: .5px;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .btn:active { transform: scale(.94); }

  .btn-yes {
    color: #fff;
    background: linear-gradient(135deg, #ff4d8d, #ff7eb3);
    box-shadow: 0 10px 26px rgba(255, 77, 141, .5);
  }
  .btn-yes:hover {
    transform: translateY(-3px) scale(1.03);
    box-shadow: 0 14px 32px rgba(255, 77, 141, .65);
  }

  .btn-no {
    color: #7b2d4e;
    background: linear-gradient(135deg, #ffffff, #ffe3ee);
    box-shadow: 0 10px 26px rgba(255, 255, 255, .45);
  }
  .btn-no:hover {
    transform: translateY(-3px) scale(1.03);
    box-shadow: 0 14px 32px rgba(255, 255, 255, .6);
  }

  .btn-back {
    color: #fff;
    background: linear-gradient(135deg, #8e7cc3, #a29bfe);
    box-shadow: 0 10px 26px rgba(142, 124, 195, .5);
  }
  .btn-back:hover {
    transform: translateY(-3px) scale(1.03);
    box-shadow: 0 14px 32px rgba(142, 124, 195, .65);
  }

  .answer {
    margin-top: 22px;
    min-height: 26px;
    font-size: 17px;
    font-weight: 700;
    color: #fff;
    text-shadow: 0 2px 10px rgba(190, 70, 120, .6);
    opacity: 0;
    transform: translateY(8px);
    transition: opacity .4s ease, transform .4s ease;
  }
  .answer.show {
    opacity: 1;
    transform: translateY(0);
  }
  .answer .emoji { font-size: 20px; }

  /* Экран "Конец" */
  .end-screen {
    position: fixed;
    inset: 0;
    background: #000;
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 24px;
    z-index: 999;
    animation: fadeIn .6s ease;
  }
  .end-screen.active { display: flex; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .end-screen .end-title {
    font-size: 56px;
    font-weight: 900;
    letter-spacing: 4px;
    color: #fff;
    text-transform: uppercase;
    font-family: 'Courier New', monospace;
    animation: endGlow 2.4s ease-in-out infinite;
  }
  @keyframes endGlow {
    0%, 100% { text-shadow: 0 0 10px rgba(255,255,255,.4); }
    50%      { text-shadow: 0 0 30px rgba(255,255,255,.9); }
  }

  .end-screen .end-text {
    margin-top: 26px;
    font-size: 18px;
    font-weight: 700;
    color: #a29bfe;
    line-height: 1.6;
    max-width: 320px;
  }

  .end-screen .end-hearts {
    margin-top: 22px;
    font-size: 28px;
    letter-spacing: 8px;
    animation: beat 1.4s ease-in-out infinite;
  }
</style>
</head>
<body>

<div class="hearts-bg" id="heartsBg"></div>

<!-- ===== ЭКРАН 1: Главный вопрос ===== -->
<div class="card" id="screen1">
  <div class="big-heart">💖</div>
  <h1><span class="name">Настя</span>,<br>я тебе нравлюсь?</h1>
  <p class="subtitle">Выбери свой ответ 💌</p>

  <div class="buttons">
    <button class="btn btn-yes" id="yesBtn1">Да 💘</button>
    <button class="btn btn-no" id="noBtn1">Нет 💔</button>
  </div>

  <div class="answer" id="answer1"></div>
</div>

<!-- ===== ЭКРАН 2: "Я надеюсь мы друзья теперь?" ===== -->
<div class="card" id="screen2" style="display:none;">
  <div class="big-heart">🤝</div>
  <h1>Я надеюсь мы<br>друзья теперь?</h1>
  <p class="subtitle">Будь честна 💫</p>

  <div class="buttons">
    <button class="btn btn-yes" id="yesBtn2">Да 💘</button>
    <button class="btn btn-no" id="noBtn2">Нет 💔</button>
    <button class="btn btn-back" id="backBtn2">Назад ↩️</button>
  </div>

  <div class="answer" id="answer2"></div>
</div>

<!-- ===== ЭКРАН 3: Чёрный экран "КОНЕЦ" ===== -->
<div class="end-screen" id="endScreen">
  <div class="end-title">END</div>
  <div class="end-text">Теперь мы с Зюзей на одной волне 🤝</div>
  <div class="end-hearts">💜🤝💜</div>
</div>

<script>
  // ---- Фоновые сердечки ----
  const heartsBg = document.getElementById('heartsBg');
  const heartEmojis = ['💖', '💕', '💗', '💓', '💞', '❤️', '💘', '🩷'];
  for (let i = 0; i < 22; i++) {
    const s = document.createElement('span');
    s.textContent = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
    s.style.left = Math.random() * 100 + 'vw';
    s.style.fontSize = (14 + Math.random() * 26) + 'px';
    s.style.animationDuration = (6 + Math.random() * 8) + 's';
    s.style.animationDelay = (Math.random() * 10) + 's';
    heartsBg.appendChild(s);
  }

  // ---- Элементы ----
  const screen1 = document.getElementById('screen1');
  const screen2 = document.getElementById('screen2');
  const endScreen = document.getElementById('endScreen');
  const answer1 = document.getElementById('answer1');
  const answer2 = document.getElementById('answer2');

  // ---- Экран 1 ----
  document.getElementById('yesBtn1').addEventListener('click', () => {
    answer1.innerHTML = '<span class="emoji">🥰</span> Ура! Я так и знал! 💖';
    answer1.classList.add('show');
    burstHearts();
  });

  document.getElementById('noBtn1').addEventListener('click', () => {
    screen1.style.display = 'none';
    screen2.style.display = 'block';
    answer2.classList.remove('show');
    answer2.innerHTML = '';
  });

  // ---- Экран 2 ----
  document.getElementById('yesBtn2').addEventListener('click', () => {
    answer2.innerHTML = '<span class="emoji">🤝</span> Я сделаю всё, чтобы завоевать твоё сердце 💘';
    answer2.classList.add('show');
  });

  document.getElementById('noBtn2').addEventListener('click', () => {
    screen2.style.display = 'none';
    endScreen.classList.add('active');
  });

  document.getElementById('backBtn2').addEventListener('click', () => {
    screen2.style.display = 'none';
    screen1.style.display = 'block';
    answer1.classList.remove('show');
    answer1.innerHTML = '';
  });

  // ---- Взрыв сердечек ----
  function burstHearts() {
    for (let i = 0; i < 18; i++) {
      const h = document.createElement('span');
      h.textContent = '💖';
      h.style.position = 'fixed';
      h.style.left = '50%';
      h.style.top = '50%';
      h.style.fontSize = (18 + Math.random() * 22) + 'px';
      h.style.pointerEvents = 'none';
      h.style.zIndex = '999';
      h.style.transition = 'transform 1s ease, opacity 1s ease';
      document.body.appendChild(h);

      const angle = Math.random() * Math.PI * 2;
      const dist = 120 + Math.random() * 220;

      requestAnimationFrame(() => {
        h.style.transform = `translate(${Math.cos(angle) * dist}px, ${Math.sin(angle) * dist}px) scale(0)`;
        h.style.opacity = '0';
      });

      setTimeout(() => h.remove(), 1100);
    }
  }
</script>

</body>
</html>
